<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Кандзи-парк</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Klee+One:wght@400;600&family=Nunito:wght@500;700;800;900&family=Unbounded:wght@600;800&family=Zen+Maru+Gothic:wght@500;700&display=swap">
<style>
/* Layout: playful "theme park" — sticker-like picture plates on a dotted sky, one colour per textbook chapter */
:root{
  --bg:#EEF3FF; --dot:#D7E1FA; --card:#FFFFFF; --ink:#1B2042; --mute:#5A6188; --rule:#D5DCF0;
  --coral:#FF5A5F; --sun:#FFAE1A; --sky:#2F7BFF; --leaf:#10B37A; --grape:#8B4DFF; --pink:#FF4D9D;
  --t-coral:#FFE3E1; --t-sun:#FFF0CC; --t-sky:#DCE9FF; --t-leaf:#D2F4E5; --t-grape:#ECE2FF; --t-pink:#FFE0EE;
  --ok:#0C9F61; --bad:#E5364F; --plate:#F7F9FF; --shadow:0 2px 0 rgba(27,32,66,.12), 0 8px 24px rgba(27,32,66,.08);
  --line:#1B2042; --pc-paper:#FFFFFF; --pc-skin:#FFD8B5; --pc-soil:#A86A3D; --pc-stone:#A3ABBE; --pc-stone2:#E6EAF2;
  --pc-sky2:#D6E7FF; --pc-leaf2:#CDEFDD; --pc-sun2:#FFE7A8; --pc-grape2:#E6DAFF;
  --f-jp:"Klee One","Zen Maru Gothic","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
  --f-kana:"Zen Maru Gothic","Klee One","Hiragino Kaku Gothic ProN",sans-serif;
  --f-ui:"Nunito","Zen Maru Gothic",system-ui,sans-serif;
  --f-disp:"Unbounded","Nunito",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#11142A; --dot:#1D2246; --card:#1C2044; --ink:#EEF0FF; --mute:#A9AFD6; --rule:#2F3566;
  --coral:#FF6E72; --sun:#FFBE3D; --sky:#5E98FF; --leaf:#2CCB8F; --grape:#A47BFF; --pink:#FF6BAE;
  --t-coral:#43233A; --t-sun:#40352A; --t-sky:#1E3166; --t-leaf:#173F3E; --t-grape:#33265F; --t-pink:#45203F;
  --ok:#30D58C; --bad:#FF627A; --plate:#E4E9F8; --shadow:0 2px 0 rgba(0,0,0,.35), 0 8px 24px rgba(0,0,0,.25);
  color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#11142A; --dot:#1D2246; --card:#1C2044; --ink:#EEF0FF; --mute:#A9AFD6; --rule:#2F3566;
  --coral:#FF6E72; --sun:#FFBE3D; --sky:#5E98FF; --leaf:#2CCB8F; --grape:#A47BFF; --pink:#FF6BAE;
  --t-coral:#43233A; --t-sun:#40352A; --t-sky:#1E3166; --t-leaf:#173F3E; --t-grape:#33265F; --t-pink:#45203F;
  --ok:#30D58C; --bad:#FF627A; --plate:#E4E9F8; --shadow:0 2px 0 rgba(0,0,0,.35), 0 8px 24px rgba(0,0,0,.25);
  color-scheme:dark }

*{box-sizing:border-box}
body{background:radial-gradient(var(--dot) 1.6px,transparent 1.7px) 0 0/22px 22px, var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:16px;line-height:1.5;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,.zone:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
#app{max-width:960px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
.c1{--cc:var(--coral);--ct:var(--t-coral)} .c2{--cc:var(--sun);--ct:var(--t-sun)} .c3{--cc:var(--sky);--ct:var(--t-sky)}
.c4{--cc:var(--leaf);--ct:var(--t-leaf)} .c5{--cc:var(--grape);--ct:var(--t-grape)}
.g-coral{--gc:var(--coral);--gt:var(--t-coral)} .g-sun{--gc:var(--sun);--gt:var(--t-sun)} .g-sky{--gc:var(--sky);--gt:var(--t-sky)}
.g-leaf{--gc:var(--leaf);--gt:var(--t-leaf)} .g-grape{--gc:var(--grape);--gt:var(--t-grape)} .g-pink{--gc:var(--pink);--gt:var(--t-pink)}

/* Japanese text */
.jp,.k,.kk{font-family:var(--f-jp);font-weight:600}
.k{border-bottom:2.5px dotted var(--cc);cursor:pointer;padding:0 1px}
.k:hover{background:var(--ct);border-radius:4px}
.w{background:var(--t-sky);border-bottom:2.5px dotted var(--sky);border-radius:6px;padding:0 .18em;cursor:pointer;font-family:var(--f-jp);font-weight:600}
.w:hover{filter:brightness(.97)}
ruby{ruby-position:over} rt{font-family:var(--f-kana);font-size:.5em;color:var(--mute);font-weight:500;letter-spacing:.02em}

/* Home */
.hero{padding-block:28px 8px;display:grid;gap:14px}
.hero h1{font-family:var(--f-disp);font-weight:800;font-size:clamp(34px,8vw,58px);line-height:1;margin:0;letter-spacing:-.02em;text-wrap:balance}
.hero h1 .jp-sub{display:block;font-family:var(--f-kana);font-weight:700;font-size:.38em;color:var(--mute);letter-spacing:.2em;margin-top:10px}
.hero p{margin:0;color:var(--mute);max-width:60ch}
.strip{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.strip .k{border:none;display:grid;place-items:center;width:46px;height:46px;border-radius:12px;background:var(--cc);color:#fff;font-size:28px;box-shadow:0 3px 0 rgba(27,32,66,.25);transform:rotate(var(--r,0deg));transition:transform .2s}
.strip .k:hover{transform:rotate(0) scale(1.08);background:var(--cc)}
.panel{background:var(--card);border-radius:20px;padding:16px;box-shadow:var(--shadow);margin-top:18px}
.panel h2{font-family:var(--f-disp);font-weight:600;font-size:15px;margin:0 0 10px;letter-spacing:.01em}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:2px solid var(--cc);background:transparent;border-radius:999px;padding:6px 12px 6px 6px;display:flex;align-items:center;gap:8px;font-weight:800;font-size:14px}
.chip .n{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--ct);color:var(--ink);font-family:var(--f-disp);font-size:12px}
.chip .j{font-family:var(--f-kana);font-weight:700;color:var(--mute)}
.chip.on{background:var(--cc);color:#fff}
.chip.on .n{background:#fff;color:var(--ink)} .chip.on .j{color:rgba(255,255,255,.85)}
.stat{display:flex;gap:16px;flex-wrap:wrap;color:var(--mute);font-size:14px;margin-top:10px}
.stat b{color:var(--ink);font-variant-numeric:tabular-nums}
.sec-h{font-family:var(--f-disp);font-weight:800;font-size:20px;margin:28px 0 12px}
.games{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:12px}
.tile{border:none;text-align:left;background:var(--card);border-radius:20px;padding:12px;display:grid;gap:8px;align-content:start;box-shadow:var(--shadow);transition:transform .15s;position:relative;overflow:hidden}
.tile:hover{transform:translateY(-3px)}
.tile .plate{background:var(--gt);border-radius:14px;aspect-ratio:16/10;display:grid;place-items:center;max-width:100%}
.tile .plate svg{height:80%;width:auto}
.tile h3{margin:0;font-family:var(--f-disp);font-weight:600;font-size:15px;line-height:1.2}
.tile p{margin:0;font-size:13px;color:var(--mute);line-height:1.4}
.tile .best{display:flex;gap:2px;height:16px}
.tile .best svg{width:16px;height:16px}
.tile.feature{grid-column:1/-1;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);align-items:center;background:var(--gt)}
.tile.feature .plate{background:var(--card)}
.tile.feature h3{font-size:20px}
@media (max-width:520px){.tile.feature{grid-template-columns:1fr}}
.foot{margin-top:28px;color:var(--mute);font-size:13px;text-align:center}

/* Screen chrome */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;align-items:center;gap:10px;padding-block:12px;background:var(--bg);margin-bottom:8px}
.back{border:none;background:var(--card);border-radius:12px;padding:8px 12px;font-weight:800;box-shadow:var(--shadow)}
.bar h1{font-family:var(--f-disp);font-weight:600;font-size:18px;margin:0;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hud{font-weight:800;font-variant-numeric:tabular-nums;display:flex;gap:10px;align-items:center;font-size:15px}
.body{display:grid;gap:14px}
.progress{height:10px;border-radius:99px;background:var(--card);overflow:hidden;box-shadow:inset 0 0 0 1px var(--rule)}
.progress i{display:block;height:100%;background:var(--gc);border-radius:99px;transition:width .3s}
.stage{background:var(--card);border-radius:22px;padding:18px;box-shadow:var(--shadow);display:grid;gap:14px;min-width:0}
.ask{margin:0;font-weight:800;color:var(--mute);font-size:14px;text-transform:uppercase;letter-spacing:.06em}
.prompt{display:grid;place-items:center;gap:6px;text-align:center;min-width:0}
.big-k{font-family:var(--f-jp);font-weight:600;font-size:clamp(84px,24vw,140px);line-height:1.05;color:var(--ink)}
.big-w{font-family:var(--f-jp);font-weight:600;font-size:clamp(38px,10vw,60px);line-height:1.5}
.big-ru{font-family:var(--f-disp);font-weight:600;font-size:clamp(22px,5.5vw,32px);line-height:1.2;text-wrap:balance}
.big-rd{font-family:var(--f-kana);font-weight:700;font-size:20px;color:var(--mute)}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.opt{border:2.5px solid var(--rule);background:var(--card);border-radius:16px;padding:14px 10px;font-weight:800;font-size:16px;min-height:64px;transition:transform .1s,border-color .15s;line-height:1.3}
.opt:hover:not(:disabled){border-color:var(--gc);transform:translateY(-2px)}
.opts.jp .opt{font-family:var(--f-jp);font-weight:600;font-size:28px}
.opts.kana .opt{font-family:var(--f-kana);font-weight:700;font-size:20px}
.opt.right{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.wrong{background:var(--bad);border-color:var(--bad);color:#fff;animation:shake .35s}
.opt:disabled{cursor:default}
.opt.right rt,.opt.wrong rt{color:rgba(255,255,255,.85)}
.fb{border-radius:20px;padding:14px 16px;display:grid;gap:10px;animation:pop .25s}
.fb.ok{background:var(--t-leaf)} .fb.bad{background:var(--t-coral)}
.fb-head{font-weight:900;font-size:18px} .fb-head .jp{font-family:var(--f-kana);margin-right:8px}
.fb.ok .fb-head{color:var(--ok)} .fb.bad .fb-head{color:var(--bad)}
.ex{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 10px;font-size:17px}
.ex .bigx{font-size:30px}
.ex .rd{font-family:var(--f-kana);font-weight:700;color:var(--mute)}
.ex-s{font-size:20px;line-height:2.1}
.btn{border:none;background:var(--gc,var(--sky));color:#fff;border-radius:14px;padding:12px 18px;font-weight:900;font-size:16px;box-shadow:0 3px 0 rgba(27,32,66,.25);justify-self:start}
.btn:active{transform:translateY(2px);box-shadow:none}
.btn.ghost{background:var(--card);color:var(--ink);box-shadow:inset 0 0 0 2px var(--rule)}
.btn:disabled{opacity:.45;cursor:default}
.say{border:none;background:var(--ct,var(--t-sky));border-radius:10px;width:34px;height:34px;display:inline-grid;place-items:center;flex:none}
.say svg{width:18px;height:18px}
.btn .ico{width:18px;height:18px;vertical-align:-3px;margin-right:6px}
.hint{color:var(--mute);font-size:14px;margin:0}
.notice{background:var(--card);border-radius:20px;padding:22px;box-shadow:var(--shadow);display:grid;gap:12px}

/* Study */
.tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.tab{border:2px solid var(--cc);background:var(--card);border-radius:999px;padding:6px 14px;font-weight:800;white-space:nowrap;font-size:14px}
.tab b{font-family:var(--f-disp);margin-right:4px}
.tab.on{background:var(--cc);color:#fff}
.kgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px}
.kcard{border:none;background:var(--card);border-radius:20px;padding:10px;display:grid;gap:4px;box-shadow:var(--shadow);transition:transform .15s;text-align:center}
.kcard:hover{transform:translateY(-3px) rotate(-1deg)}
.kcard .plate{background:var(--ct);border-radius:14px;aspect-ratio:1;display:grid;place-items:center;max-width:100%;position:relative}
.kcard .plate svg{width:72%;height:72%}
.kcard .kc{font-family:var(--f-jp);font-weight:600;font-size:46px;line-height:1.1}
.kcard .km{font-size:13px;color:var(--mute);font-weight:700}

/* Sheet */
#sheet{position:fixed;inset:0;z-index:20;background:rgba(10,14,40,.5);display:grid;align-items:end;justify-items:center;padding:12px;padding-bottom:max(12px,env(safe-area-inset-bottom,0px))}
@media (min-width:640px){#sheet{align-items:center}}
.sheet-card{background:var(--card);border-radius:26px;width:100%;max-width:560px;max-height:88vh;overflow:auto;padding:20px;display:grid;gap:14px;position:relative;animation:up .25s}
.x{position:absolute;right:12px;top:12px;border:none;background:var(--ct);width:38px;height:38px;border-radius:50%;font-size:22px;font-weight:900;line-height:1}
.sk-top{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px;align-items:center}
.sk-top .plate{background:var(--ct);border-radius:20px;aspect-ratio:1;display:grid;place-items:center;max-width:100%}
.sk-top .plate svg{width:78%;height:78%}
.sk-k{font-family:var(--f-jp);font-weight:600;font-size:clamp(96px,26vw,150px);line-height:1;text-align:center;color:var(--ink)}
.sk-m{font-family:var(--f-disp);font-weight:600;font-size:24px;text-align:center}
.sk-rd{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.sk-rd div{background:var(--ct);border-radius:14px;padding:8px;display:grid;text-align:center}
.sk-rd span{font-size:11px;font-weight:900;text-transform:uppercase;letter-spacing:.08em;color:var(--mute)}
.sk-rd b{font-family:var(--f-kana);font-size:17px}
.mn{background:var(--plate);color:#1B2042;border-radius:16px;padding:12px 14px;border-left:0;font-size:15px}
.sheet-card h3{margin:4px 0 0;font-family:var(--f-disp);font-weight:600;font-size:16px}
.wl{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.wl li{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:2px 12px;align-items:center;padding:8px 10px;border-radius:14px;background:var(--bg)}
.wl .w{font-size:22px;grid-row:span 2;line-height:1.9}
.wl .wr{font-family:var(--f-kana);font-weight:700;color:var(--mute);font-size:14px}
.wl .wm{font-size:14px;grid-column:2}
.wl .say{grid-row:1/span 2;grid-column:3}
.sk-nav{display:flex;justify-content:space-between;gap:8px}
.sk-nav .btn{font-family:var(--f-jp)}

/* Tooltip */
#tip{position:fixed;z-index:30;background:var(--card);color:var(--ink);border-radius:16px;padding:12px 14px;box-shadow:0 10px 40px rgba(10,14,40,.3);max-width:min(320px,calc(100vw - 16px));display:grid;gap:6px;animation:pop .15s;border:2px solid var(--rule)}
.tip-head{display:flex;gap:12px;align-items:center}
.tip-big{font-family:var(--f-jp);font-weight:600;font-size:52px;line-height:1;width:66px;height:66px;display:grid;place-items:center;background:var(--ct);border-radius:14px;flex:none}
.tip-m{font-weight:900;font-size:17px;line-height:1.25}
.tip-rd{font-size:14px;font-family:var(--f-kana);font-weight:700}
.tip-rd span{font-family:var(--f-ui);font-size:11px;font-weight:900;color:var(--mute);text-transform:uppercase;margin-right:4px}
.tip-w{font-family:var(--f-jp);font-weight:600;font-size:30px;line-height:1.7}
.tip-r{display:flex;align-items:center;gap:8px;font-family:var(--f-kana);font-weight:700;color:var(--mute);font-size:16px}
.tip-ks{display:flex;flex-wrap:wrap;gap:6px;margin-top:2px}
.tk{background:var(--ct);border-radius:10px;padding:3px 8px;font-size:13px;font-weight:700;cursor:pointer}
.tk b{font-family:var(--f-jp);font-size:18px;margin-right:4px}

/* Memory */
.mgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media (max-width:520px){.mgrid{grid-template-columns:repeat(3,minmax(0,1fr))}}
.mcard{border:none;background:transparent;padding:0;aspect-ratio:3/4;perspective:700px;max-width:100%}
.mcard .in{position:relative;width:100%;height:100%;transition:transform .4s;transform-style:preserve-3d}
.mcard.open .in,.mcard.done .in{transform:rotateY(180deg)}
.mcard .face{position:absolute;inset:0;border-radius:16px;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:grid;place-items:center;box-shadow:var(--shadow)}
.mcard .bk{background:repeating-linear-gradient(45deg,var(--leaf) 0 10px,#22c48b 10px 20px);color:#fff;font-family:var(--f-kana);font-weight:700;font-size:22px}
.mcard .fr{background:var(--card);transform:rotateY(180deg);border:3px solid var(--rule)}
.mcard .fr .kc{font-family:var(--f-jp);font-weight:600;font-size:clamp(44px,12vw,64px)}
.mcard .fr .plate{background:var(--ct);width:86%;aspect-ratio:1;border-radius:12px;display:grid;place-items:center}
.mcard .fr .plate svg{width:80%;height:80%}
.mcard.done .fr{border-color:var(--ok);animation:pop .3s}

/* Balloons */
.sky{position:relative;height:min(68vh,560px);min-height:400px;border-radius:24px;overflow:hidden;background:linear-gradient(#7FB6FF,#CFE4FF 70%,#E8F7EE);touch-action:manipulation;box-shadow:var(--shadow)}
.sky .cloud{position:absolute;background:#fff;border-radius:99px;opacity:.85}
.target{position:absolute;left:50%;top:12px;transform:translateX(-50%);z-index:3;background:#fff;color:#1B2042;border-radius:16px;padding:8px 16px;text-align:center;box-shadow:0 4px 0 rgba(27,32,66,.2);max-width:calc(100% - 24px)}
.target small{display:block;font-size:11px;font-weight:900;text-transform:uppercase;letter-spacing:.08em;color:#5A6188}
.target b{font-family:var(--f-disp);font-weight:600;font-size:20px}
.balloon{position:absolute;top:0;width:78px;height:96px;border:none;padding:0;background:transparent;will-change:transform}
.balloon .bb{position:absolute;inset:0 0 14px;border-radius:50% 50% 48% 48%;background:radial-gradient(circle at 32% 28%,rgba(255,255,255,.7) 0 10%,transparent 11%),var(--bc);display:grid;place-items:center;box-shadow:inset -6px -8px 0 rgba(0,0,0,.12)}
.balloon .bb span{font-family:var(--f-jp);font-weight:600;font-size:36px;color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.25)}
.balloon::after{content:"";position:absolute;left:50%;bottom:0;width:2px;height:16px;background:rgba(27,32,66,.4)}
.balloon.pop .bb{animation:popout .25s forwards}
.balloon.miss{animation:shake .35s}
.lives{display:flex;gap:4px}
.lives svg{width:20px;height:20px}

/* Builder */
.slots{display:flex;flex-wrap:wrap;justify-content:center;align-items:flex-end;gap:6px;font-family:var(--f-jp);font-weight:600;font-size:40px;line-height:1.6;min-height:84px}
.slot{width:68px;height:68px;border-radius:14px;border:3px dashed var(--sun);background:var(--t-sun);font-family:var(--f-jp);font-weight:600;font-size:44px;display:grid;place-items:center;padding:0}
.slot.f{border-style:solid;background:var(--card)}
.slot.right{border-color:var(--ok);background:var(--t-leaf)} .slot.wrong{border-color:var(--bad);background:var(--t-coral)}
.kana{font-family:var(--f-jp)}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.tilek{border:none;background:var(--sun);color:#1B2042;border-radius:14px;aspect-ratio:1;font-family:var(--f-jp);font-weight:600;font-size:clamp(30px,8vw,40px);box-shadow:0 4px 0 rgba(27,32,66,.25);max-width:100%}
.tilek:disabled{opacity:.25;box-shadow:none}

/* Shop */
.tag{display:grid;gap:4px;place-items:center;text-align:center}
.tag .emo{font-size:64px;line-height:1}
.tag .nm{font-family:var(--f-kana);font-weight:700;font-size:20px}
.price{background:var(--sun);color:#1B2042;font-family:var(--f-jp);font-weight:600;font-size:clamp(28px,8vw,44px);padding:6px 18px;border-radius:12px;position:relative;box-shadow:0 4px 0 rgba(27,32,66,.2)}
.price.yen{font-family:var(--f-disp);font-weight:800;letter-spacing:.02em;font-variant-numeric:tabular-nums}
.pay{min-height:64px;border-radius:14px;background:var(--bg);display:flex;align-items:center;justify-content:center;font-family:var(--f-jp);font-weight:600;font-size:clamp(26px,7vw,38px);padding:6px 12px;border:2.5px dashed var(--grape);word-break:break-all}
.pay.empty{color:var(--mute);font-family:var(--f-ui);font-size:15px;font-weight:700}
.pad{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.pad button{border:none;border-radius:12px;background:var(--t-grape);font-family:var(--f-jp);font-weight:600;font-size:clamp(24px,6.5vw,32px);padding:8px 0;box-shadow:0 3px 0 rgba(27,32,66,.18)}
.pad .wide{font-family:var(--f-ui);font-size:15px;font-weight:900}
.row{display:flex;flex-wrap:wrap;gap:10px}

/* Ball scene */
.scene{width:100%;max-width:520px;justify-self:center;border-radius:18px;overflow:hidden;background:var(--plate)}
.scene svg{display:block;width:100%;height:auto}
.zone{fill:transparent;cursor:pointer;transition:fill .15s}
.zone:hover{fill:rgba(47,123,255,.16)}
.sent{font-family:var(--f-jp);font-weight:600;font-size:clamp(20px,5.4vw,26px);line-height:2.2;text-align:center}
.sent .pos{background:var(--grape);color:#fff;border-radius:8px;padding:0 6px}
.ru{font-weight:800;font-size:17px;color:var(--mute);text-align:center}
.gap{display:inline-block;min-width:2.4em;border-bottom:3px solid var(--gc);text-align:center;color:var(--gc)}
.gap.filled{border-bottom-color:var(--ok);color:inherit}

/* Sprint */
.timer{height:14px;border-radius:99px;background:var(--card);overflow:hidden;box-shadow:inset 0 0 0 1px var(--rule)}
.timer i{display:block;height:100%;background:linear-gradient(90deg,var(--coral),var(--sun));transition:width .25s linear}
.card-sp{display:grid;gap:8px;place-items:center;text-align:center;min-height:220px;align-content:center}
.card-sp .eq{font-weight:900;color:var(--mute)}
.tf{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tf button{border:none;border-radius:18px;padding:18px;font-weight:900;font-size:20px;color:#fff;box-shadow:0 4px 0 rgba(27,32,66,.25)}
.tf .no{background:var(--bad)} .tf .yes{background:var(--ok)}
.combo{font-family:var(--f-disp);font-weight:800;color:var(--pink)}
.flash-ok{animation:flashok .4s} .flash-bad{animation:shake .35s}

/* Results */
.res{background:var(--card);border-radius:26px;padding:28px 20px;box-shadow:var(--shadow);display:grid;gap:12px;justify-items:center;text-align:center}
.stars{display:flex;gap:8px}
.stars svg{width:clamp(56px,16vw,80px);height:auto;animation:pop .4s backwards}
.stars svg:nth-child(2){animation-delay:.12s} .stars svg:nth-child(3){animation-delay:.24s}
.res-jp{font-family:var(--f-kana);font-weight:700;font-size:30px}
.res-score{font-family:var(--f-disp);font-weight:600;font-size:18px}
.res-btns{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.mist{display:grid;gap:8px;width:100%;max-width:480px;text-align:left}
.mist .ex{background:var(--bg);border-radius:12px;padding:8px 12px}

#toast{position:fixed;left:50%;bottom:max(20px,env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:40;background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:14px;font-weight:800;box-shadow:0 8px 30px rgba(0,0,0,.25);max-width:calc(100vw - 32px)}
#toast .jp{font-size:22px;margin-right:6px}

@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@keyframes pop{0%{transform:scale(.85);opacity:.4}100%{transform:scale(1);opacity:1}}
@keyframes popout{to{transform:scale(1.5);opacity:0}}
@keyframes up{from{transform:translateY(30px);opacity:.3}to{transform:none;opacity:1}}
@keyframes flashok{0%{box-shadow:0 0 0 0 var(--ok)}100%{box-shadow:0 0 0 18px transparent}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const pick=a=>a[Math.random()*a.length|0];
const sample=(a,n)=>shuffle(a).slice(0,n);

// Render Japanese markup: «word» → tappable word, {漢|かん} → furigana, studied kanji → tappable kanji
function jp(s,tips=true){let out='',i=0;
  while(i<s.length){const ch=s[i];
    if(ch==='«'){const j=s.indexOf('»',i);const inner=s.slice(i+1,j);const p=strip(inner);
      out+=tips&&WMAP[p]?`<span class="w" data-w="${esc(p)}">${jp(inner,false)}</span>`:jp(inner,tips);i=j+1;continue}
    if(ch==='{'){const j=s.indexOf('}',i);const [a,b]=s.slice(i+1,j).split('|');out+=`<ruby>${a}<rt>${b}</rt></ruby>`;i=j+1;continue}
    if(K[ch]){out+=tips?`<span class="k c${K[ch].ch}" data-k="${ch}">${ch}</span>`:`<span class="kk">${ch}</span>`;i++;continue}
    out+=esc(ch);i++}
  return out}
const wordChip=w=>`<span class="w" data-w="${esc(w.p)}">${jp(w.w,false)}</span>`;
const kChip=c=>`<span class="k c${K[c].ch}" data-k="${c}">${c}</span>`;
const wEx=w=>`<div class="ex"><span class="bigx">${wordChip(w)}</span><span class="rd">${w.r}</span><span>— ${esc(w.m)}</span><button class="say c3" data-say="${w.r}" aria-label="Послушать">${SPK}</button></div>`;
const kEx=k=>`<div class="ex"><span class="bigx">${kChip(k.c)}</span><b>${esc(k.m)}</b><span class="rd">${k.kun!=='—'?k.kun+' · ':''}${k.on}</span><button class="say c${k.ch}" data-say="${sayK(k)}" aria-label="Послушать">${SPK}</button></div>`;
function sayK(k){return k.kun!=='—'?k.kun.split('・')[0].replace(/[()]/g,''):k.on.split('・')[0]}
function say(t){try{const u=new SpeechSynthesisUtterance(t);u.lang='ja-JP';u.rate=.85;const v=speechSynthesis.getVoices().find(v=>/^ja/i.test(v.lang));if(v)u.voice=v;speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){toast('Озвучка недоступна в этом браузере')}}
try{speechSynthesis.getVoices()}catch(e){}

const kPool=()=>{const p=KANJI.filter(k=>sel.has(k.ch));return p.length?p:KANJI};
const wOK=w=>w.ks.length?w.ks.every(c=>sel.has(K[c].ch)):sel.has(w.ch);
const wPool=()=>{const p=WORDS.filter(wOK);return p.length>=4?p:WORDS};
function opts(correct,pool,n=4){return shuffle([correct,...uniq(pool).filter(x=>x!==correct).slice(0,n-1)])}
function prefer(target,list,keyCh){const same=shuffle(list.filter(x=>keyCh(x)===target)),rest=shuffle(list.filter(x=>keyCh(x)!==target));return [...same,...rest]}

let toastT;
function toast(html){const t=$('#toast');t.innerHTML=html;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,1800)}

/* Tooltip */
const tip=$('#tip');
function showTip(t){let html='';
  if(t.dataset.w){const w=WMAP[t.dataset.w];if(!w)return;
    html=`<div class="tip-w">${jp(w.w,false)}</div><div class="tip-r">${w.r}<button class="say c3" data-say="${w.r}" aria-label="Послушать">${SPK}</button></div><div class="tip-m">${esc(w.m)}</div>`+(w.ks.length?`<div class="tip-ks">${uniq(w.ks).map(c=>`<span class="tk c${K[c].ch}" data-k="${c}"><b>${c}</b>${esc(K[c].m)}</span>`).join('')}</div>`:'')}
  else{const k=K[t.dataset.k];if(!k)return;
    html=`<div class="tip-head"><span class="tip-big c${k.ch}">${k.c}</span><div><div class="tip-m">${esc(k.m)}</div><div class="tip-rd"><span>кун</span>${k.kun}</div><div class="tip-rd"><span>он</span>${k.on}</div></div><button class="say c${k.ch}" data-say="${sayK(k)}" aria-label="Послушать">${SPK}</button></div>`}

function balloons(){const body=openScreen('balloons');const pool=kPool().length>=4?kPool():KANJI;

  const sky=$('#sky'),tg=$('#tg');const cols=['var(--coral)','var(--sky)','var(--leaf)','var(--grape)','var(--pink)','var(--sun)'];

    el.style.transform=`translateY(${b.y}px)`;
    el.addEventListener('pointerdown',ev=>{ev.preventDefault();hit(b)});
    sky.appendChild(el);list.push(b)}
  function hit(b){if(b.dead||over)return;
    if(b.c===target.c){b.dead=true;b.el.classList.add('pop');setTimeout(()=>b.el.remove(),260);streak++;score+=10+(streak>=5?10:streak>=3?5:0);

    else{streak=0;lives--;b.el.classList.add('miss');missed.push(target.c);upd();if(lives<=0)end()}}
  function loop(now){const dt=Math.min(.05,(now-last)/1000);last=now;elapsed+=dt;spawnT-=dt;
    if(spawnT<=0){spawn();spawnT=Math.max(.55,1.25-elapsed*.008)}

function segs(w){const out=[];let i=0;while(i<w.length){const ch=w[i];
  if(ch==='{'){const j=w.indexOf('}',i);const[a,b]=w.slice(i+1,j).split('|');out.push({t:'r',a,b});i=j+1;continue}
  if(K[ch]){out.push({t:'k',c:ch});i++;continue}
  const l=out[out.length-1];if(l&&l.t==='s')l.s+=ch;else out.push({t:'s',s:ch});i++}return out}
const builderQ=w=>({mount(el,done){const sg=segs(w.w);const need=sg.filter(s=>s.t==='k').map(s=>s.c);
  const ch=Math.max(...need.map(c=>K[c].ch));
  const dis=prefer(ch,KANJI.filter(k=>!need.includes(k.c)),x=>x.ch).slice(0,Math.max(4,8-need.length)).map(k=>k.c);
  const tiles=shuffle([...need,...dis]).map((c,id)=>({c,id}));const fill=need.map(()=>null);let si=0;
  el.innerHTML=`<p class="ask">Собери слово</p><div class="prompt"><div class="big-ru">${esc(w.m)}</div><div class="big-rd">${w.r}</div></div>
    <div class="slots">${sg.map(s=>s.t==='k'?`<button class="slot" data-s="${si++}" aria-label="Пустая клетка"></button>`:s.t==='r'?`<ruby>${s.a}<rt>${s.b}</rt></ruby>`:`<span class="kana">${esc(s.s)}</span>`).join('')}</div>
    <div class="tiles">${tiles.map(t=>`<button class="tilek" data-t="${t.id}">${t.c}</button>`).join('')}</div>`;
  const slotEls=[...el.querySelectorAll('.slot')],tileEls=[...el.querySelectorAll('.tilek')];let finished=false;
  function paint(){slotEls.forEach((s,i)=>{s.textContent=fill[i]!=null?tiles[fill[i]].c:'';s.classList.toggle('f',fill[i]!=null)});
    tileEls.forEach(t=>t.disabled=finished||fill.includes(+t.dataset.t))}
  tileEls.forEach(t=>t.onclick=()=>{if(finished)return;const e=fill.indexOf(null);if(e<0)return;fill[e]=+t.dataset.t;paint();
    if(!fill.includes(null)){finished=true;paint();const ok=fill.every((f,i)=>tiles[f].c===need[i]);
      slotEls.forEach((s,i)=>{s.classList.add(tiles[fill[i]].c===need[i]?'right':'wrong');s.disabled=true});
      setTimeout(()=>done(ok,wEx(w)),300)}});
  slotEls.forEach((s,i)=>s.onclick=()=>{if(finished||fill[i]==null)return;fill[i]=null;paint()});
  paint()}});
function builder(){const p=wPool().filter(w=>w.ks.length&&w.p.length>1);
  const multi=shuffle(p.filter(w=>w.ks.length>=2)),single=shuffle(p.filter(w=>w.ks.length===1));
  let pick8=[...multi.slice(0,5),...single.slice(0,3)];if(pick8.length<8)pick8=[...pick8,...shuffle(p.filter(w=>!pick8.includes(w)))].slice(0,8);
  if(!pick8.length)pick8=sample(WORDS.filter(w=>w.ks.length>=2),8);
  runRound('builder',shuffle(pick8).map(builderQ))}

/* ====================== SHOP ====================== */
const DK=['','一','二','三','四','五','六','七','八','九'];
function u4k(x){let s='';const th=x/1000|0,h=(x%1000)/100|0,t=(x%100)/10|0,o=x%10;
  if(th)s+=(th>1?DK[th]:'')+'千';if(h)s+=(h>1?DK[h]:'')+'百';if(t)s+=(t>1?DK[t]:'')+'十';if(o)s+=DK[o];return s}
const toKanji=n=>{const m=n/10000|0,r=n%10000;return(m?u4k(m)+'万':'')+u4k(r)};
const DR=['','いち','に','さん','よん','ご','ろく','なな','はち','きゅう'];
function u4r(x){let s='';const th=x/1000|0,h=(x%1000)/100|0,t=(x%100)/10|0,o=x%10;
  if(th)s+=th===1?'せん':th===3?'さんぜん':th===8?'はっせん':DR[th]+'せん';
  if(h)s+=h===1?'ひゃく':h===3?'さんびゃく':h===6?'ろっぴゃく':h===8?'はっぴゃく':DR[h]+'ひゃく';
  if(t)s+=t===1?'じゅう':DR[t]+'じゅう';if(o)s+=DR[o];return s}
const toKana=n=>{const m=n/10000|0,r=n%10000;return(m?(m===1?'いちまん':u4r(m)+'まん'):'')+u4r(r)+'えん'};
const yen=n=>'¥'+n.toLocaleString('en-US');
const ITEMS=[['🍬','ガム',80,150,10],['🧃','ジュース',120,200,10],['🍙','おにぎり',100,250,10],['🍞','パン',150,480,10],['🍜','ラーメン',700,1300,50],
['👕','Tシャツ',1000,3500,100],['☂️','かさ',500,2500,100],['👟','くつ',3000,9800,100],['🎒','かばん',5000,19800,100],['🚲','じてんしゃ',15000,40000,1000],
['⌚','とけい',10000,60000,1000],['💻','パソコン',60000,250000,1000]];
function price(it){const[, ,a,b,st]=it;return Math.round((a+Math.random()*(b-a))/st)*st}
const priceEx=n=>`<div class="ex"><span class="bigx jp">${jp(toKanji(n)+'円',true)}</span><b>${yen(n)}</b><span class="rd">${toKana(n)}</span><button class="say c1" data-say="${toKana(n)}" aria-label="Послушать">${SPK}</button></div>`;
const shopRead=()=>{const it=pick(ITEMS),n=price(it);
  const d=uniq([n*10,Math.round(n/10),n+(n>=10000?10000:n>=1000?1000:100),Math.max(10,n-(n>=10000?10000:n>=1000?1000:100)),
    +String(n).split('').reverse().join('')||n+20,n+(n>=1000?500:50)].filter(x=>x!==n&&x>=10&&Number.isInteger(x)));
  return mcqQ({ask:'Сколько стоит?',prompt:`<div class="tag"><div class="emo">${it[0]}</div><div class="nm">${it[1]}</div><div class="price">${toKanji(n)}円</div></div>`,
    opts:shuffle([n,...shuffle(d).slice(0,3)]),ans:n,fmt:yen,explain:priceEx(n)})};
const shopWrite=()=>({mount(el,done){const it=pick(ITEMS),n=price(it),goal=toKanji(n)+'円';let s='';
  el.innerHTML=`<p class="ask">Напиши цену кандзи</p><div class="prompt"><div class="tag"><div class="emo">${it[0]}</div><div class="nm">${it[1]}</div><div class="price yen">${yen(n)}</div></div></div>
  <div class="pay empty" id="pay">Нажимай на кандзи ниже</div>
  <div class="pad">${['一','二','三','四','五','六','七','八','九','十','百','千','万','円'].map(c=>`<button data-c="${c}">${c}</button>`).join('')}<button class="wide" data-del aria-label="Стереть">⌫</button></div>
  <button class="btn" id="paybtn" disabled>Оплатить</button>`;
  const pay=el.querySelector('#pay'),btn=el.querySelector('#paybtn');let fin=false;
  const draw=()=>{pay.textContent=s||'Нажимай на кандзи ниже';pay.classList.toggle('empty',!s);btn.disabled=!s||fin};
  el.querySelectorAll('.pad button').forEach(b=>b.onclick=()=>{if(fin)return;if('del'in b.dataset)s=s.slice(0,-1);else if(s.length<12)s+=b.dataset.c;draw()});
  btn.onclick=()=>{if(fin)return;fin=true;draw();const ok=s===goal;pay.style.borderColor=ok?'var(--ok)':'var(--bad)';pay.style.borderStyle='solid';
    el.querySelectorAll('.pad button').forEach(b=>b.disabled=true);done(ok,priceEx(n)+(ok?'':`<p class="hint">Ты написал: <span class="jp">${esc(s)}</span>. Помни: 1000 — это просто 千, а 10 000 — 一万.</p>`))};draw()}});
function shop(){if(!sel.has(1))return needCh('shop',1);runRound('shop',[shopRead(),shopWrite(),shopRead(),shopWrite(),shopRead(),shopWrite(),shopRead(),shopWrite()])}

/* ====================== BALL ====================== */
const POS={box:{'上':[150,70],'下':[150,190],'左':[82,136],'右':[218,136],'中':[150,118]},house:{'中':[172,160],'外':[262,166]},ring:{'内側':[150,140],'外側':[262,66]}};
const NOUN={box:'はこ',house:'いえ',ring:'«円»'};
const RU={box:{'上':'Мяч над коробкой.','下':'Мяч под коробкой.','左':'Мяч слева от коробки.','右':'Мяч справа от коробки.','中':'Мяч в коробке.'},house:{'中':'Мяч в доме.','外':'Мяч снаружи дома.'},ring:{'内側':'Мяч внутри круга.','外側':'Мяч снаружи круга.'}};
const posMk=p=>p==='内側'?'内{側|がわ}':p==='外側'?'外{側|がわ}':p;
function ballSVG([x,y],good){return `<g><circle cx="${x}" cy="${y}" r="14" fill="var(--coral)" ${L}/><path d="M${x-13} ${y-4} Q${x} ${y+6} ${x+13} ${y-4}" stroke="#fff" stroke-width="4" fill="none"/><circle cx="${x-5}" cy="${y-6}" r="3" fill="#fff" opacity=".8"/>${good===undefined?'':`<circle cx="${x}" cy="${y}" r="21" fill="none" stroke="${good?'var(--ok)':'var(--bad)'}" stroke-width="4"/>`}</g>`}
function sceneSVG(kind,pos,zones,good){let s='',ball=pos?ballSVG(POS[kind][pos],good):'';
  if(kind==='box'){s+=`<rect width="300" height="220" fill="var(--pc-sky2)"/><path d="M0 212 H300" ${L}/><rect x="70" y="156" width="8" height="56" fill="var(--pc-soil)" ${L2}/><rect x="222" y="156" width="8" height="56" fill="var(--pc-soil)" ${L2}/><rect x="56" y="150" width="188" height="10" rx="3" fill="var(--pc-soil)" ${L}/>
    <rect x="110" y="95" width="80" height="55" fill="#C98A4B" ${L}/>${pos==='中'?ball:''}<rect x="110" y="116" width="80" height="34" fill="var(--sun)" ${L}/><path d="M118 126 h20" stroke="#fff" stroke-width="3" opacity=".6"/>${pos&&pos!=='中'?ball:''}`;
    if(zones)s+=[['上',95,18,110,76],['中',110,95,80,55],['左',0,60,108,90],['右',192,60,108,90],['下',60,162,180,50]].map(([z,x,y,w,h])=>`<rect class="zone" data-z="${z}" x="${x}" y="${y}" width="${w}" height="${h}" rx="10" tabindex="0"/>`).join('')}
  if(kind==='house'){s+=`<rect width="300" height="220" fill="var(--pc-sky2)"/><rect y="180" width="300" height="40" fill="var(--pc-leaf2)"/><path d="M0 180 H300" ${L}/><circle cx="40" cy="40" r="16" fill="var(--sun)"/>
    <path d="M86 96 L150 44 L214 96Z" fill="var(--grape)" ${L}/><rect x="100" y="96" width="100" height="84" fill="var(--pc-paper)" ${L}/><rect x="112" y="136" width="24" height="44" fill="var(--pc-sun2)" ${L2}/><rect x="152" y="108" width="34" height="24" fill="var(--pc-sky2)" ${L2}/>${ball}`;
    if(zones)s+=`<rect class="zone" data-z="中" x="100" y="44" width="100" height="136" tabindex="0"/><rect class="zone" data-z="外" x="0" y="30" width="96" height="190" tabindex="0"/><rect class="zone" data-z="外" x="204" y="30" width="96" height="190" tabindex="0"/>`}
  if(kind==='ring'){s+=`<rect width="300" height="220" fill="var(--pc-leaf2)"/>`+(zones?`<rect class="zone" data-z="外側" width="300" height="220" tabindex="0"/>`:'')+`<ellipse cx="150" cy="140" rx="96" ry="48" fill="var(--pc-sun2)" stroke="var(--pc-soil)" stroke-width="8"/>${ball}`;
    if(zones)s+=`<ellipse class="zone" data-z="内側" cx="150" cy="140" rx="92" ry="44" tabindex="0"/>`}
  return `<svg viewBox="0 0 300 220" role="img" aria-label="Сцена с мячом">${s}</svg>`}
const ballSent=(kind,p,tips)=>jp(`ボールは ${NOUN[kind]}の `,tips)+`<span class="pos">${jp(posMk(p),tips&&false)}</span>`+jp('に あります。',tips);
const ballEx=(kind,p)=>`<div class="ex-s jp">${jp(`ボールは ${NOUN[kind]}の «${posMk(p)}»に あります。`,true)}</div><p class="hint">${RU[kind][p]}</p>`;
function ballQ(kind,p,type){
  if(type==='A'){const o=kind==='box'?opts(p,shuffle(['上','下','左','右','中'])):kind==='house'?shuffle(['中','外','上','左']):shuffle(['内側','外側']);
    return mcqQ({ask:'Где мяч?',prompt:`<div class="scene">${sceneSVG(kind,p)}</div>`,opts:o,ans:p,cls:'jp',fmt:x=>jp(posMk(x),false),explain:ballEx(kind,p)})}
  return {mount(el,done){
    el.innerHTML=`<p class="ask">Нажми, куда положить мяч</p><div class="sent">${ballSent(kind,p,false)}</div><div class="scene" id="sc">${sceneSVG(kind,null,true)}</div>`;
    const sc=el.querySelector('#sc');let fin=false;
    const choose=z=>{if(fin)return;fin=true;const ok=z===p;sc.innerHTML=sceneSVG(kind,z,false,ok);done(ok,ballEx(kind,p))};
    sc.querySelectorAll('.zone').forEach(zn=>{zn.addEventListener('click',()=>choose(zn.dataset.z));zn.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();choose(zn.dataset.z)}})})}}}
function ball(){if(!sel.has(5))return needCh('ball',5);
  const all=[...['上','下','左','右','中'].map(p=>['box',p]),['house','中'],['house','外'],['ring','内側'],['ring','外側']];
  const qs=sample(all,8).map(([k,p],i)=>ballQ(k,p,i%2?'B':'A'));runRound('ball',qs)}

/* ====================== GAP ====================== */
function gap(){const avail=SENT.filter(s=>WMAP[s.a]&&wOK(WMAP[s.a]));
  if(!avail.length){const body=openScreen('gap');body.innerHTML=`<div class="notice">Включи больше глав в меню — для этих глав пока нет фраз.</div>`;return}
  const qs=sample(avail,Math.min(8,avail.length)).map(s=>{const w=WMAP[s.a];
    const parts=s.s.split('＿');
    return mcqQ({ask:'Вставь подходящее слово',prompt:`<div class="ru">${esc(s.ru)}</div><div class="sent">${jp(parts[0])}<span class="gap">？</span>${jp(parts[1]||'')}</div>`,
      opts:shuffle([s.a,...s.d]),ans:s.a,cls:'jp',fmt:x=>WMAP[x]?jp(WMAP[x].w,false):jp(x,false),
      after:el=>{const g=el.querySelector('.gap');g.classList.add('filled');g.innerHTML=jp(`«${w.w}»`,true)},explain:wEx(w)})});
  runRound('gap',qs)}

/* ====================== SPRINT ====================== */
function sprint(){const body=openScreen('sprint');const ks=kPool(),ws=wPool().filter(w=>w.ks.length);const DUR=45;
  let left=DUR,score=0,correct=0,wrong=0,combo=0,cur,timer,fin=false;const mist=[];
  body.innerHTML=`<div class="timer"><i id="tm" style="width:100%"></i></div><section class="stage" id="sp"><div class="card-sp" id="card"></div></section><div class="tf"><button class="no" id="no">✗ Неверно</button><button class="yes" id="yes">✓ Верно</button></div><p class="hint">Совпадает ли кандзи или слово со значением? На клавиатуре: ← неверно, → верно.</p>`;
  const card=$('#card'),sp=$('#sp');
  function next(){const useW=ws.length>4&&Math.random()<.45;
    if(useW){const w=pick(ws),t=Math.random()<.5,m=t?w.m:pick(WORDS.filter(x=>x.m!==w.m&&x.ch===w.ch).concat(WORDS.filter(x=>x.m!==w.m))).m;
      cur={t,ex:wEx(w),key:w.p};card.innerHTML=`<div class="big-w">${jp(w.w,false)}</div><div class="eq">значит</div><div class="big-ru">${esc(m)}</div>`}
    else{const k=pick(ks),t=Math.random()<.5,m=t?k.m:pick(prefer(k.ch,KANJI.filter(x=>x.c!==k.c),x=>x.ch).slice(0,6)).m;
      cur={t,ex:kEx(k),key:k.c};card.innerHTML=`<div class="big-k" style="font-size:clamp(72px,20vw,110px)">${k.c}</div><div class="eq">значит</div><div class="big-ru">${esc(m)}</div>`}}
  function upd(){hud(`${score}${combo>=3?` <span class="combo">×${combo>=8?3:2}</span>`:''}`)}
  function answer(v){if(fin)return;if(v===cur.t){correct++;combo++;score+=10*(combo>=8?3:combo>=3?2:1);sp.classList.remove('flash-ok');void sp.offsetWidth;sp.classList.add('flash-ok')}
    else{wrong++;combo=0;if(!mist.some(m=>m.key===cur.key))mist.push(cur);sp.classList.remove('flash-bad');void sp.offsetWidth;sp.classList.add('flash-bad')}
    upd();next()}
  $('#yes').onclick=()=>answer(true);$('#no').onclick=()=>answer(false);
  const kd=e=>{if(e.key==='ArrowRight')answer(true);if(e.key==='ArrowLeft')answer(false)};addEventListener('keydown',kd);
  timer=setInterval(()=>{left-=.25;$('#tm').style.width=(left/DUR*100)+'%';if(left<=0)end()},250);
  function end(){fin=true;clearInterval(timer);removeEventListener('keydown',kd);
    results('sprint',{score,stars:correct>=24?3:correct>=16?2:correct>=8?1:0,label:`Очки: ${score} · верно ${correct}, ошибок ${wrong}`,extra:mist.length?`<div class="mist"><p class="hint">Повтори:</p>${mist.slice(-6).map(m=>m.ex).join('')}</div>`:''})}
  cleanup=()=>{fin=true;clearInterval(timer);removeEventListener('keydown',kd)};
  next();upd()}

const ROUTES={home,study,quiz,memory,balloons,builder,shop,ball,gap,sprint};
home();
</script>
